<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient (Obsidian Canvas) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141517"/>
      <stop offset="50%" stop-color="#101113"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38404a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#24272c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#18191c" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Sovereign Core Blue/Indigo Gradient -->
    <linearGradient id="k8s-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#339af0"/>
      <stop offset="70%" stop-color="#4c6ef5"/>
      <stop offset="100%" stop-color="#748ffc"/>
    </linearGradient>

    <!-- Accent Helm Gradient -->
    <linearGradient id="helm-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Isometric Stack Layer 1 (Base - Core Compute) -->
    <linearGradient id="stack-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0f141d"/>
    </linearGradient>

    <!-- Isometric Stack Layer 2 (Middle - Topology Mesh) -->
    <linearGradient id="stack-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2e48"/>
      <stop offset="100%" stop-color="#131c2b"/>
    </linearGradient>

    <!-- Isometric Stack Layer 3 (Top - AI & Orchestration) -->
    <linearGradient id="stack-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23395d"/>
      <stop offset="100%" stop-color="#162338"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#339af0" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#748ffc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#101113" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Drop Shadow -->
    <filter id="shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#1c7ed6" flood-opacity="0.32"/>
    </filter>

    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas (Apple macOS Big Sur+ Continuous Squircle) -->
  <rect x="32" y="32" width="960" height="960" rx="214" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="8"/>

  <!-- Sovereign Ambient Radial Glow -->
  <circle cx="512" cy="512" r="420" fill="url(#ambient-glow)"/>

  <!-- Network Mesh Outer Orbit Ring -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="#252a33" stroke-width="4" stroke-dasharray="10 18"/>
  <circle cx="512" cy="512" r="320" fill="none" stroke="#1d222b" stroke-width="2"/>

  <!-- Sovereign Stack Isometric Tier Platform (Backdrop) -->
  <g filter="url(#shadow-soft)" opacity="0.95">
    <!-- Bottom Stack Tier (Compute & K3s Engine) -->
    <path d="M 272 680 L 512 790 L 752 680 L 512 580 Z" fill="url(#stack-base)" stroke="#20344f" stroke-width="3"/>
    
    <!-- Middle Stack Tier (Topology Mesh & Observability) -->
    <path d="M 272 630 L 512 740 L 752 630 L 512 530 Z" fill="url(#stack-mid)" stroke="#2b476b" stroke-width="3"/>

    <!-- Top Stack Tier (Platform Intelligence & Terminal Studio) -->
    <path d="M 272 580 L 512 690 L 752 580 L 512 480 Z" fill="url(#stack-top)" stroke="#3b6496" stroke-width="3"/>
  </g>

  <!-- Central Kubernetes 7-Spoke Sovereign Helm (Timão do Kubernetes) -->
  <g filter="url(#shadow-deep)">
    <!-- Central Outer Ring -->
    <circle cx="512" cy="460" r="210" fill="none" stroke="url(#k8s-glow)" stroke-width="38" stroke-linecap="round"/>

    <!-- Inner Protective Hub Shield -->
    <circle cx="512" cy="460" r="96" fill="#141923" stroke="url(#k8s-glow)" stroke-width="10"/>
    <circle cx="512" cy="460" r="64" fill="url(#k8s-glow)"/>
    <circle cx="512" cy="460" r="28" fill="#0e1117"/>

    <!-- 7 Spokes of Kubernetes (360° / 7 = 51.42857° intervals) -->
    <!-- Center: (512, 460). Inner R=96, Outer R=210, Spoke Pin R=270 -->

    <!-- Spoke 1 (0° - Top) -->
    <line x1="512" y1="364" x2="512" y2="250" stroke="url(#k8s-glow)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="512" cy="226" r="32" fill="url(#helm-accent)" stroke="#e0f2fe" stroke-width="4"/>
    <circle cx="512" cy="226" r="12" fill="#0e1117"/>

    <!-- Spoke 2 (51.4286° - Top Right) -->
    <line x1="587" y1="385" x2="674" y2="298" stroke="url(#k8s-glow)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="696" cy="276" r="32" fill="url(#helm-accent)" stroke="#e0f2fe" stroke-width="4"/>
    <circle cx="696" cy="276" r="12" fill="#0e1117"/>

    <!-- Spoke 3 (102.8571° - Right) -->
    <line x1="606" y1="481" x2="720" y2="505" stroke="url(#k8s-glow)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="748" cy="512" r="32" fill="url(#helm-accent)" stroke="#e0f2fe" stroke-width="4"/>
    <circle cx="748" cy="512" r="12" fill="#0e1117"/>

    <!-- Spoke 4 (154.2857° - Bottom Right) -->
    <line x1="554" y1="546" x2="618" y2="678" stroke="url(#k8s-glow)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="634" cy="710" r="32" fill="url(#helm-accent)" stroke="#e0f2fe" stroke-width="4"/>
    <circle cx="634" cy="710" r="12" fill="#0e1117"/>

    <!-- Spoke 5 (205.7143° - Bottom Left) -->
    <line x1="470" y1="546" x2="406" y2="678" stroke="url(#k8s-glow)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="390" cy="710" r="32" fill="url(#helm-accent)" stroke="#e0f2fe" stroke-width="4"/>
    <circle cx="390" cy="710" r="12" fill="#0e1117"/>

    <!-- Spoke 6 (257.1429° - Left) -->
    <line x1="418" y1="481" x2="304" y2="505" stroke="url(#k8s-glow)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="276" cy="512" r="32" fill="url(#helm-accent)" stroke="#e0f2fe" stroke-width="4"/>
    <circle cx="276" cy="512" r="12" fill="#0e1117"/>

    <!-- Spoke 7 (308.5714° - Top Left) -->
    <line x1="437" y1="385" x2="350" y2="298" stroke="url(#k8s-glow)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="328" cy="276" r="32" fill="url(#helm-accent)" stroke="#e0f2fe" stroke-width="4"/>
    <circle cx="328" cy="276" r="12" fill="#0e1117"/>
  </g>

  <!-- Observability Day-0 Node Status Indicators -->
  <g opacity="0.9">
    <circle cx="512" cy="850" r="12" fill="#38d9a9"/>
    <circle cx="468" cy="850" r="8" fill="#339af0"/>
    <circle cx="556" cy="850" r="8" fill="#748ffc"/>
  </g>
</svg>
